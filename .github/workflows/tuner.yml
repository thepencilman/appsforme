name: Deploy Tuner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tuner/**', '.github/workflows/tuner.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tuner
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}tuner/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test pitch detection
        run: node tuner/test/pitch.test.mjs
      - name: Prepare site
        run: |
          mkdir -p _site/tuner
          cp tuner/*.html tuner/*.css tuner/*.js tuner/*.webmanifest _site/tuner/
          cp -r tuner/icons _site/tuner/icons
          # Pages deploys replace the whole site, so keep Tangent (deployed by tangent.yml) in it too.
          cp -r tangent/site _site/tangent
          echo '<!doctype html><meta http-equiv="refresh" content="0;url=tangent/"><a href="tangent/">Tangent</a>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
